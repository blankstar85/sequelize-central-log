# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm ci
    - run: npm run lint
    - run: npm run typecheck
    - run: npm run build --if-present
    - run: npm test

  # The build job tests on SQLite. This runs the same tests on each database server,
  # one job per database so they run in parallel.
  databases:
    name: test (${{ matrix.dialect }})

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - dialect: mysql
            image: mysql:8.4
            port: 3306
            user: root
            health: mysqladmin ping -ptest
          - dialect: mariadb
            image: mariadb:11.4
            port: 3306
            user: root
            health: healthcheck.sh --connect --innodb_initialized
          - dialect: postgres
            image: postgres:17
            port: 5432
            user: postgres
            health: pg_isready -U postgres

    services:
      db:
        image: ${{ matrix.image }}
        # Each image reads only its own variables.
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: central_log
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: central_log
          POSTGRES_PASSWORD: test
          POSTGRES_DB: central_log
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DB_DIALECT: ${{ matrix.dialect }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_USER: ${{ matrix.user }}
      DB_PASSWORD: test
      DB_NAME: central_log

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24.x
    - run: npm ci
    - run: npm test
