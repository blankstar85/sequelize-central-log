# Publishes to npm when a GitHub release is published (created by `npm run release`).
# Uses npm trusted publishing, so no NPM_TOKEN secret is needed.

name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24.x
        registry-url: https://registry.npmjs.org
    - name: Check the tag matches package.json
      run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
    - run: npm ci
    - run: npm run lint
    - run: npm run typecheck
    - run: npm test
    - run: npm run build
    - run: npm publish
